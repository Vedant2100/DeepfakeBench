preprocess:
  comp:
    choices:
    - raw
    - c23
    - c40
    default: c23
  dataset_name:
    default: FaceForensics++
  dataset_root_path:
    default: ../datasets
  mode:
    choices:
    - fixed_num_frames
    - fixed_stride
    default: fixed_num_frames
  num_frames:
    default: 32
    type: int
  stride:
    default: 10
    type: int
rearrange:
  comp:
    choices:
    - raw
    - c23
    - c40
    default: c23
  dataset_name:
    choices:
    - FaceForensics++
    - DeepFakeDetection
    - Celeb-DF-v1
    - Celeb-DF-v2
    - DFDCP
    - DFDC
    - DeeperForensics-1.0
    - UADFV
    - FaceShifter
    default: Celeb-DF-v1
  dataset_root_path:
    default: ../datasets
    type: str
  output_file_path:
    default: ./dataset_json
    type: str
  perturbation:
    choices:
    - end_to_end
    - end_to_end_level_1
    - end_to_end_level_2
    - end_to_end_level_3
    - end_to_end_level_4
    - end_to_end_level_5
    - end_to_end_mix_2_distortions
    - end_to_end_mix_3_distortions
    - end_to_end_mix_4_distortions
    - end_to_end_random_level
    - reenact_postprocess
    default: end_to_end
to_lmdb:
  comp:
    choices:
    - raw
    - c23
    - c40
    default: c23
  dataset_name:
    choices:
    - FaceForensics++
    - DeepFakeDetection
    - Celeb-DF-v1
    - Celeb-DF-v2
    - DFDCP
    - DFDC
    - DeeperForensics-1.0
    - UADFV
    - FaceShifter
    default: FaceForensics++
  dataset_root_path:
    default: ./datasets_v2
    type: str
  output_lmdb_dir:
    default: ./datasets_lmdbs
    type: str
